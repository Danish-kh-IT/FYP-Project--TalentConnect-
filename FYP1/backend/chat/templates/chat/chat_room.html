<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h4>Chat with {{ other_user.username }}</h4>
    <div id="chat-box" class="border rounded p-3 mb-3" style="height:300px; overflow-y:auto;">
      {% for msg in messages %}
        <p><strong>{{ msg.sender.username }}:</strong> {{ msg.content }}</p>
      {% endfor %}
    </div>

    <div class="input-group">
      <input id="message-input" type="text" class="form-control" placeholder="Type your message...">
      <button id="send-btn" class="btn btn-primary">Send</button>
    </div>
  </div>

  <script>
    const userId = "{{ other_user.id }}";
    const ws = new WebSocket(`ws://${window.location.host}/ws/chat/${userId}/`);

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML += `<p><strong>${data.sender}:</strong> ${data.message}</p>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    };

    document.getElementById("send-btn").onclick = () => {
      const input = document.getElementById("message-input");
      ws.send(JSON.stringify({ message: input.value }));
      input.value = "";
    };
  </script>
</body>
</html>
